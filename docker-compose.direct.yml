services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAKE_TARGET: "${RINHA_MAKE_TARGET:-all}"
    image: "${RINHA_IMAGE:-rinha-c-phase9c:local}"
    platform: linux/amd64
    ports:
      - "9999:8080"
    environment:
      RINHA_ADDR: ":8080"
      RINHA_LISTEN_MODE: "tcp"
      RINHA_INDEX_PATH: "/app/resources/index.bin"
      RINHA_KDPRIMARY_PATH: "/app/resources/kdprimary.bin"
      RINHA_KDPRIMARY_TOUCH: "${RINHA_KDPRIMARY_TOUCH:-false}"
      RINHA_KDPRIMARY2_PATH: "/app/resources/kdprimary2.bin"
      RINHA_KDPRIMARY2_TOUCH: "${RINHA_KDPRIMARY2_TOUCH:-true}"
      RINHA_KDTREE_PATH: "/app/resources/kdtree.bin"
      RINHA_KDTREE_REPAIR_ENABLED: "${RINHA_KDTREE_REPAIR_ENABLED:-false}"
      RINHA_KDTREE_REPAIR_POLICY: "${RINHA_KDTREE_REPAIR_POLICY:-boundary23_far45}"
      RINHA_INDEX_WARMUP: "${RINHA_INDEX_WARMUP:-off}"
      RINHA_INDEX_WARMUP_QUERIES: "${RINHA_INDEX_WARMUP_QUERIES:-2048}"
      RINHA_INDEX_MADVISE: "${RINHA_INDEX_MADVISE:-false}"
      RINHA_SEARCH_IMPL: "${RINHA_SEARCH_IMPL:-kdprimary2}"
      RINHA_IVF8_MAX_CANDIDATES: "4096"
      RINHA_IVF8_PROBES: "8"
      RINHA_METRICS_ENABLED: "${RINHA_METRICS_ENABLED:-false}"
      RINHA_EXEC_MODE: "${RINHA_EXEC_MODE:-per_connection}"
      RINHA_WORKERS: "${RINHA_WORKERS:-1}"
      RINHA_API_PROCESS_MODE: "${RINHA_API_PROCESS_MODE:-sync}"
      RINHA_API_WORKERS: "${RINHA_API_WORKERS:-1}"
      RINHA_FD_QUEUE_SIZE: "${RINHA_FD_QUEUE_SIZE:-1024}"
    volumes:
      - ../rinha-2026-go/release/index.bin:/app/resources/index.bin:ro
      - ./tmp/kdprimary/kdprimary-l32.bin:/app/resources/kdprimary.bin:ro
      - ./tmp/kdprimary2/kdprimary2-l64.bin:/app/resources/kdprimary2.bin:ro
      - ./tmp/kdtree/kdtree.bin:/app/resources/kdtree.bin:ro
    cpus: "${RINHA_DIRECT_CPUS:-0.95}"
    mem_limit: "${RINHA_DIRECT_MEM:-320m}"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
