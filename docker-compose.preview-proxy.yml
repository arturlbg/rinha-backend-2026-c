services:
  lb:
    image: ${RINHA_FDLB_IMAGE:-rinha-c-fdlb:local}
    environment:
      RINHA_LB_MODE: "proxy"
      RINHA_LB_ADDR: ":9999"
      RINHA_PROXY_UPSTREAMS: "/sockets/api1.sock,/sockets/api2.sock"
      RINHA_PROXY_BACKLOG: "${RINHA_PROXY_BACKLOG:-4096}"
      RINHA_FDLB_LISTEN_BACKLOG: "${RINHA_PROXY_BACKLOG:-4096}"
      RINHA_FDLB_REUSEPORT: "${RINHA_FDLB_REUSEPORT:-true}"
      RINHA_LB_CONNECT_RETRY_MS: "${RINHA_LB_CONNECT_RETRY_MS:-25}"
      RINHA_LB_STARTUP_TIMEOUT_MS: "${RINHA_LB_STARTUP_TIMEOUT_MS:-10000}"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    ports:
      - "9999:9999"
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    cpus: "${LB_CPUS:-0.05}"
    mem_limit: "${LB_MEMORY:-16m}"

  api1:
    image: ${RINHA_API_IMAGE:-rinha-c-preview:kdprimary2-l64}
    environment:
      RINHA_SEARCH_IMPL: "${RINHA_SEARCH_IMPL:-kdprimary2}"
      RINHA_KDPRIMARY2_PATH: "/app/resources/kdprimary2.bin"
      RINHA_KDPRIMARY2_TOUCH: "${RINHA_KDPRIMARY2_TOUCH:-true}"
      RINHA_KDCLASS3_PATH: "/app/resources/kdclass3.bin"
      RINHA_KDCLASS3_TOUCH: "${RINHA_KDCLASS3_TOUCH:-true}"
      RINHA_KDCLASS3_FALLBACK: "${RINHA_KDCLASS3_FALLBACK:-none}"
      RINHA_LISTEN_MODE: "unix_http"
      RINHA_UNIX_SOCKET: "/sockets/api1.sock"
      RINHA_EXEC_MODE: "${RINHA_EXEC_MODE:-epoll}"
      RINHA_API_PROCESS_MODE: "${RINHA_API_PROCESS_MODE:-sync}"
      RINHA_API_PROCESSES: "1"
      RINHA_METRICS_ENABLED: "${RINHA_METRICS_ENABLED:-false}"
      RINHA_DEBUG_TIMING: "${RINHA_DEBUG_TIMING:-false}"
      RINHA_DEBUG_INSTANCE: "api1"
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    healthcheck:
      test: ["CMD", "test", "-S", "/sockets/api1.sock"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s
    cpus: "${API_CPUS:-0.475}"
    mem_limit: "${API_MEMORY:-167m}"

  api2:
    image: ${RINHA_API_IMAGE:-rinha-c-preview:kdprimary2-l64}
    environment:
      RINHA_SEARCH_IMPL: "${RINHA_SEARCH_IMPL:-kdprimary2}"
      RINHA_KDPRIMARY2_PATH: "/app/resources/kdprimary2.bin"
      RINHA_KDPRIMARY2_TOUCH: "${RINHA_KDPRIMARY2_TOUCH:-true}"
      RINHA_KDCLASS3_PATH: "/app/resources/kdclass3.bin"
      RINHA_KDCLASS3_TOUCH: "${RINHA_KDCLASS3_TOUCH:-true}"
      RINHA_KDCLASS3_FALLBACK: "${RINHA_KDCLASS3_FALLBACK:-none}"
      RINHA_LISTEN_MODE: "unix_http"
      RINHA_UNIX_SOCKET: "/sockets/api2.sock"
      RINHA_EXEC_MODE: "${RINHA_EXEC_MODE:-epoll}"
      RINHA_API_PROCESS_MODE: "${RINHA_API_PROCESS_MODE:-sync}"
      RINHA_API_PROCESSES: "1"
      RINHA_METRICS_ENABLED: "${RINHA_METRICS_ENABLED:-false}"
      RINHA_DEBUG_TIMING: "${RINHA_DEBUG_TIMING:-false}"
      RINHA_DEBUG_INSTANCE: "api2"
    volumes:
      - sockets:/sockets
    networks:
      - rinha
    healthcheck:
      test: ["CMD", "test", "-S", "/sockets/api2.sock"]
      interval: 1s
      timeout: 1s
      retries: 30
      start_period: 1s
    cpus: "${API_CPUS:-0.475}"
    mem_limit: "${API_MEMORY:-167m}"

networks:
  rinha:
    driver: bridge

volumes:
  sockets:
