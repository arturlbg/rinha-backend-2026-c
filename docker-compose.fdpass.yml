services:
  lb:
    image: ghcr.io/arturlbg/rinha-backend-2026-go:fdlb
    platform: linux/amd64
    ports:
      - "9999:9999"
    environment:
      RINHA_LB_ADDR: ":9999"
      RINHA_FDPASS_UPSTREAMS: "/sockets/api1.ctrl,/sockets/api2.ctrl"
    volumes:
      - sockets:/sockets
    depends_on:
      - api1
      - api2
    cpus: "0.05"
    mem_limit: 16m
    networks:
      - rinha

  api1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAKE_TARGET: "${RINHA_MAKE_TARGET:-all}"
    image: rinha-c-phase8d:local
    platform: linux/amd64
    user: "0:0"
    environment:
      RINHA_LISTEN_MODE: "fdpass"
      RINHA_UNIX_SOCKET: "/sockets/api1.ctrl"
      RINHA_INDEX_PATH: "/app/resources/index.bin"
      RINHA_KDTREE_PATH: "/app/resources/kdtree.bin"
      RINHA_KDTREE_REPAIR_ENABLED: "${RINHA_KDTREE_REPAIR_ENABLED:-false}"
      RINHA_KDTREE_REPAIR_POLICY: "${RINHA_KDTREE_REPAIR_POLICY:-boundary23_far45}"
      RINHA_INDEX_WARMUP: "${RINHA_INDEX_WARMUP:-off}"
      RINHA_INDEX_WARMUP_QUERIES: "${RINHA_INDEX_WARMUP_QUERIES:-2048}"
      RINHA_INDEX_MADVISE: "${RINHA_INDEX_MADVISE:-false}"
      RINHA_SEARCH_IMPL: "${RINHA_SEARCH_IMPL:-scalar}"
      RINHA_IVF8_MAX_CANDIDATES: "4096"
      RINHA_IVF8_PROBES: "8"
      RINHA_METRICS_ENABLED: "${RINHA_METRICS_ENABLED:-false}"
      RINHA_EXEC_MODE: "${RINHA_EXEC_MODE:-per_connection}"
      RINHA_WORKERS: "${RINHA_WORKERS:-1}"
      RINHA_FD_QUEUE_SIZE: "${RINHA_FD_QUEUE_SIZE:-1024}"
    volumes:
      - sockets:/sockets
      - ../rinha-2026-go/release/index.bin:/app/resources/index.bin:ro
      - ./tmp/kdtree/kdtree.bin:/app/resources/kdtree.bin:ro
    cpus: "0.475"
    mem_limit: 167m
    networks:
      - rinha

  api2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAKE_TARGET: "${RINHA_MAKE_TARGET:-all}"
    image: rinha-c-phase8d:local
    platform: linux/amd64
    user: "0:0"
    environment:
      RINHA_LISTEN_MODE: "fdpass"
      RINHA_UNIX_SOCKET: "/sockets/api2.ctrl"
      RINHA_INDEX_PATH: "/app/resources/index.bin"
      RINHA_KDTREE_PATH: "/app/resources/kdtree.bin"
      RINHA_KDTREE_REPAIR_ENABLED: "${RINHA_KDTREE_REPAIR_ENABLED:-false}"
      RINHA_KDTREE_REPAIR_POLICY: "${RINHA_KDTREE_REPAIR_POLICY:-boundary23_far45}"
      RINHA_INDEX_WARMUP: "${RINHA_INDEX_WARMUP:-off}"
      RINHA_INDEX_WARMUP_QUERIES: "${RINHA_INDEX_WARMUP_QUERIES:-2048}"
      RINHA_INDEX_MADVISE: "${RINHA_INDEX_MADVISE:-false}"
      RINHA_SEARCH_IMPL: "${RINHA_SEARCH_IMPL:-scalar}"
      RINHA_IVF8_MAX_CANDIDATES: "4096"
      RINHA_IVF8_PROBES: "8"
      RINHA_METRICS_ENABLED: "${RINHA_METRICS_ENABLED:-false}"
      RINHA_EXEC_MODE: "${RINHA_EXEC_MODE:-per_connection}"
      RINHA_WORKERS: "${RINHA_WORKERS:-1}"
      RINHA_FD_QUEUE_SIZE: "${RINHA_FD_QUEUE_SIZE:-1024}"
    volumes:
      - sockets:/sockets
      - ../rinha-2026-go/release/index.bin:/app/resources/index.bin:ro
      - ./tmp/kdtree/kdtree.bin:/app/resources/kdtree.bin:ro
    cpus: "0.475"
    mem_limit: 167m
    networks:
      - rinha

volumes:
  sockets:

networks:
  rinha:
    driver: bridge
