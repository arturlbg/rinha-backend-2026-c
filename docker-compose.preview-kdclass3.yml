services:
  lb:
    image: ${RINHA_FDLB_IMAGE:-rinha-c-fdlb:local}
    platform: linux/amd64
    ports:
      - "9999:9999"
    environment:
      RINHA_LB_ADDR: ":9999"
      RINHA_FDPASS_UPSTREAMS: "/sockets/api1.ctrl,/sockets/api2.ctrl"
      RINHA_FDLB_LEAN: "false"
      RINHA_FDLB_STRATEGY: "round_robin"
      RINHA_FDLB_METRICS: "${RINHA_FDLB_METRICS:-false}"
      RINHA_FDLB_TCP_DEFER_ACCEPT: "false"
      RINHA_FDLB_TCP_FASTOPEN: "false"
      RINHA_FDLB_SO_BUSY_POLL_US: "0"
      RINHA_FDLB_LISTEN_BACKLOG: "${RINHA_FDLB_LISTEN_BACKLOG:-4096}"
      RINHA_FDLB_REUSEPORT: "${RINHA_FDLB_REUSEPORT:-true}"
      RINHA_LB_CONNECT_RETRY_MS: "${RINHA_LB_CONNECT_RETRY_MS:-25}"
      RINHA_LB_STARTUP_TIMEOUT_MS: "${RINHA_LB_STARTUP_TIMEOUT_MS:-10000}"
    volumes:
      - sockets:/sockets
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    cpus: "${LB_CPUS:-0.05}"
    mem_limit: "${LB_MEMORY:-16m}"
    networks:
      - rinha

  api1:
    image: ${RINHA_API_IMAGE:-rinha-c-preview:kdclass3-l64}
    platform: linux/amd64
    user: "0:0"
    environment:
      RINHA_LISTEN_MODE: "fdpass"
      RINHA_UNIX_SOCKET: "/sockets/api1.ctrl"
      RINHA_SEARCH_IMPL: "kdclass3"
      RINHA_KDCLASS3_PATH: "/app/resources/kdclass3.bin"
      RINHA_KDCLASS3_TOUCH: "${RINHA_KDCLASS3_TOUCH:-true}"
      RINHA_KDCLASS3_FALLBACK: "${RINHA_KDCLASS3_FALLBACK:-none}"
      RINHA_EXEC_MODE: "epoll"
      RINHA_API_PROCESS_MODE: "sync"
      RINHA_API_PROCESSES: "1"
      RINHA_FAST_FRAUD_PARSER: "${RINHA_FAST_FRAUD_PARSER:-false}"
      RINHA_API_TCP_NODELAY: "${RINHA_API_TCP_NODELAY:-true}"
      RINHA_API_TCP_QUICKACK: "${RINHA_API_TCP_QUICKACK:-true}"
      RINHA_METRICS_ENABLED: "${RINHA_METRICS_ENABLED:-false}"
      RINHA_DEBUG_TIMING: "${RINHA_DEBUG_TIMING:-false}"
      RINHA_DEBUG_INSTANCE: "api1"
    volumes:
      - sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /sockets/api1.ctrl"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 1s
    cpus: "${API_CPUS:-0.475}"
    mem_limit: "${API_MEMORY:-167m}"
    networks:
      - rinha

  api2:
    image: ${RINHA_API_IMAGE:-rinha-c-preview:kdclass3-l64}
    platform: linux/amd64
    user: "0:0"
    environment:
      RINHA_LISTEN_MODE: "fdpass"
      RINHA_UNIX_SOCKET: "/sockets/api2.ctrl"
      RINHA_SEARCH_IMPL: "kdclass3"
      RINHA_KDCLASS3_PATH: "/app/resources/kdclass3.bin"
      RINHA_KDCLASS3_TOUCH: "${RINHA_KDCLASS3_TOUCH:-true}"
      RINHA_KDCLASS3_FALLBACK: "${RINHA_KDCLASS3_FALLBACK:-none}"
      RINHA_EXEC_MODE: "epoll"
      RINHA_API_PROCESS_MODE: "sync"
      RINHA_API_PROCESSES: "1"
      RINHA_FAST_FRAUD_PARSER: "${RINHA_FAST_FRAUD_PARSER:-false}"
      RINHA_API_TCP_NODELAY: "${RINHA_API_TCP_NODELAY:-true}"
      RINHA_API_TCP_QUICKACK: "${RINHA_API_TCP_QUICKACK:-true}"
      RINHA_METRICS_ENABLED: "${RINHA_METRICS_ENABLED:-false}"
      RINHA_DEBUG_TIMING: "${RINHA_DEBUG_TIMING:-false}"
      RINHA_DEBUG_INSTANCE: "api2"
    volumes:
      - sockets:/sockets
    healthcheck:
      test: ["CMD-SHELL", "test -S /sockets/api2.ctrl"]
      interval: 1s
      timeout: 1s
      retries: 60
      start_period: 1s
    cpus: "${API_CPUS:-0.475}"
    mem_limit: "${API_MEMORY:-167m}"
    networks:
      - rinha

volumes:
  sockets:

networks:
  rinha:
    driver: bridge
